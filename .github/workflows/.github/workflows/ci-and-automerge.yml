name: CI & Auto-merge for Cursor PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Type Check & Lint
        run: |
          npm run lint --if-present
          npx tsc --noEmit --if-present

      - name: Build Project
        run: npm run build --if-present

  auto-merge:
    name: auto-merge
    needs: verify
    runs-on: ubuntu-latest
    if: >
      contains(github.event.pull_request.user.login, 'cursor') ||
      startsWith(github.event.pull_request.head.ref, 'cursor') ||
      startsWith(github.event.pull_request.head.ref, 'hos-')
    steps:
      - name: Enable GitHub Auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.html_url }}" --auto --merge --delete-branch
